name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# 同一分支的多个 PR 只跑最新一次，节省 CI 资源
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------
  # 门禁 1：语法检查（最快，秒级反馈，挡掉最基础的错误）
  # ---------------------------------------------------------------
  syntax:
    name: 语法检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 全部 Python 文件语法编译检查
        run: |
          # 排除历史遗留的不可导入片段文件
          EXCLUDE="websocket_server_reload.py"
          FILES=$(find . -name "*.py" -not -path "*/__pycache__/*" \
                  -not -path "./.git/*" | grep -v "$EXCLUDE")
          echo "检查 $(echo "$FILES" | wc -l) 个 Python 文件..."
          # -W ignore::SyntaxWarning：允许文档字符串里的转义告警，不阻断
          python3 -W ignore::SyntaxWarning -m py_compile $FILES
          echo "✅ 语法检查通过"

      - name: 检查是否有 .pyc 残留进库
        run: |
          if git diff --name-only --cached | grep -q '\.pyc$'; then
            echo "❌ 提交里混入了 .pyc 文件"
            exit 1
          fi
          echo "✅ 无 .pyc 残留"

  # ---------------------------------------------------------------
  # 门禁 2：密钥与私人地址扫描（开源仓库的红线）
  # ---------------------------------------------------------------
  security:
    name: 密钥扫描
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 扫描真实密钥
        run: |
          echo "=== ① 硬编码密钥（32位hex / 长 token）==="
          MATCHES=$(git grep -nIE "['\"][0-9a-f]{32,}['\"]" -- '*.py' '*.yaml' '*.json' '*.sh' \
                    | grep -v "YOUR_" | grep -v "00000000" | grep -v "ffffffff" || true)
          if [ -n "$MATCHES" ]; then
            echo "❌ 发现疑似真实密钥："
            echo "$MATCHES"
            exit 1
          fi
          echo "✅ 无真实密钥"

      - name: 扫描私人内网地址
        run: |
          echo "=== ② 内网 IP ==="
          MATCHES=$(git grep -nIE "\b(192\.168|10)\.[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}\b" \
                    -- '*.py' '*.yaml' '*.json' '*.sh' '*.html' \
                    | grep -vE "YOUR_|10\.0\.0\.0/8|192\.168\.0\.0/16|192\.168\.0\.0|10\.0\.0\.0|0\.0\.0\.0" || true)
          if [ -n "$MATCHES" ]; then
            echo "❌ 发现私人内网地址："
            echo "$MATCHES"
            exit 1
          fi
          echo "✅ 无私人内网地址"

      - name: 扫描敏感配置文件是否被提交
        run: |
          echo "=== ③ 敏感配置文件 ==="
          BAD=$(git ls-files | grep -E "^(config\.yaml|.*\.env|.*onenet_config\.yaml|mcp_server_settings\.json)$" || true)
          if [ -n "$BAD" ]; then
            echo "❌ 以下敏感文件不应入库："
            echo "$BAD"
            exit 1
          fi
          echo "✅ 无敏感配置文件"

  # ---------------------------------------------------------------
  # 门禁 3：单元测试
  # ---------------------------------------------------------------
  test:
    name: 单元测试
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装测试依赖
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-asyncio
          pip install -r requirements.txt --no-deps 2>/dev/null || true

      - name: 跑单元测试
        run: |
          set +e
          python -m pytest tests/unit -q -p no:cacheprovider \
            --ignore=tests/unit/test_filler_rotate_fix_20.py \
            --ignore=tests/unit/test_transition_fix_21.py \
            2>&1 | tail -40
          EXIT=$?
          # 收集阶段失败（INTERNALERROR）不阻断，但用例失败必须阻断
          if [ $EXIT -ne 0 ] && [ $EXIT -ne 1 ]; then
            echo "❌ 测试运行异常"
            exit 1
          fi
          if [ $EXIT -eq 1 ]; then
            echo "❌ 有测试用例失败"
            exit 1
          fi
          echo "✅ 测试通过"

  # ---------------------------------------------------------------
  # 门禁 4：构建检查（保证 clone 下来能跑）
  # ---------------------------------------------------------------
  build:
    name: 构建检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 检查关键文件齐全
        run: |
          for f in app.py requirements.txt restart.sh LICENSE README.md; do
            if [ ! -f "$f" ]; then
              echo "❌ 缺少关键文件: $f"
              exit 1
            fi
          done
          echo "✅ 关键文件齐全"

      - name: 检查 Python 依赖声明有效
        run: |
          python - <<'EOF'
          import re, sys
          bad = []
          with open("requirements.txt", encoding="utf-8") as f:
              for i, line in enumerate(f, 1):
                  line = line.strip()
                  if not line or line.startswith("#"):
                      continue
                  if not re.match(r"^[A-Za-z0-9_.\-]+", line):
                      bad.append(f"第 {i} 行: {line}")
          if bad:
              print("❌ requirements.txt 格式异常:")
              print("\n".join(bad))
              sys.exit(1)
          print("✅ requirements.txt 格式正确")
          EOF
